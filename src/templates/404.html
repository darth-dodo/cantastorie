<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found · Cantastorie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet" />
  <script src="/static/js/palette.js"></script>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <style>
    .not-found {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem 1.5rem;
      background: var(--surface);
      font-family: var(--font-app);
      text-align: center;
    }

    .not-found__moon {
      width: 5rem;
      height: 5rem;
      background: var(--accent);
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }

    .not-found__moon::before {
      content: "";
      position: absolute;
      top: 1rem;
      right: 0.75rem;
      width: 1.5rem;
      height: 1.5rem;
      background: var(--surface);
      border-radius: 50%;
    }

    .not-found__code {
      font-family: var(--font-app);
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .not-found__heading {
      margin: 0;
      font-family: var(--font-story);
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
    }

    .not-found__lede {
      margin: 0;
      max-width: 26rem;
      font-family: var(--font-app);
      font-size: 1rem;
      color: var(--ink-soft);
      line-height: 1.6;
    }

    .not-found__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .not-found__btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.25rem;
      border-radius: 999px;
      font-family: var(--font-app);
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity var(--settle);
    }

    .not-found__btn:hover {
      opacity: 0.85;
    }

    .not-found__btn--primary {
      background: var(--primary);
      color: #FFFDF7;
      box-shadow: var(--btn-shadow);
    }

    .not-found__btn--ghost {
      background: var(--ghost);
      color: var(--primary-text);
    }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found__moon" aria-hidden="true"></div>

    <p class="not-found__code">404</p>

    <h1 class="not-found__heading">This page wandered off&nbsp;somewhere.</h1>

    <p class="not-found__lede">
      It might have moved, or perhaps it never existed here.
      Let's get you back to the stories.
    </p>

    <nav class="not-found__actions" aria-label="Find your way back">
      <a class="not-found__btn not-found__btn--primary" href="/">Home</a>
      <a class="not-found__btn not-found__btn--ghost" href="/play">Child's shelf →</a>
    </nav>
  </main>
</body>
</html>
